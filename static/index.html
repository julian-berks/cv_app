<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask about Julian's CV</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        body {
            font-family: Avenir, Helvetica, Arial, sans-serif;
            background: #f4f5f7;
            color: #333;
            margin: 0;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.08);
        }
        header {
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
        }
        h1 {
            margin: 0;
            font-size: 1.25rem;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.4;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .message.user {
            align-self: flex-end;
            background: #0f62fe;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.bot {
            align-self: flex-start;
            background: #eef0f3;
            border-bottom-left-radius: 4px;
        }
        .message.error {
            align-self: flex-start;
            background: #fdecea;
            color: #c62828;
            border-bottom-left-radius: 4px;
        }
        .typing {
            color: #888;
            font-style: italic;
        }
        .composer {
            display: flex;
            gap: 10px;
            padding: 12px 20px;
            border-top: 1px solid #e5e7eb;
        }
        textarea {
            flex: 1;
            padding: 10px 14px;
            font: inherit;
            border: 1px solid #ccc;
            border-radius: 20px;
            resize: none;
        }
        button {
            padding: 10px 24px;
            font: inherit;
            color: #fff;
            background: #0f62fe;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        button:disabled {
            background: #9bb7f0;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>Ask about Julian's CV</h1>
        </header>

        <main class="messages" ref="messages">
            <div v-for="(message, index) in messages" :key="index" class="message" :class="message.role">{{ message.text }}</div>
            <div v-if="loading" class="message bot typing">Thinking...</div>
        </main>

        <form class="composer" @submit.prevent="ask">
            <textarea v-model="question" rows="1" maxlength="1000" aria-label="Your question"
                      placeholder="e.g. What is Julian's experience with S3?"
                      @keydown.enter.exact.prevent="ask"></textarea>
            <button type="submit" :disabled="loading || !question.trim()">Send</button>
        </form>
    </div>

    <script src="static/app.js"></script>
</body>
</html>
